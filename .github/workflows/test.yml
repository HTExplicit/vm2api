# Focused offline checks for amd64 fork releases.
name: ci

on:
  push:
    branches: [maint]
  pull_request:
    branches: [maint]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - run: npm ci
      - name: installer and upgrade shell syntax
        run: |
          bash -n deploy/install.sh
          sh -n scripts/panel-upgrade.sh
      - name: focused backend regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            test/unit/release.test.mjs \
            test/unit/release-errors.test.mjs \
            test/unit/release-source.test.mjs \
            test/unit/release-kernel.test.mjs \
            test/unit/panel-update.test.mjs \
            test/unit/kernel-health-thread.test.mjs \
            test/unit/panel-vm-health.test.mjs \
            test/unit/rust-kernel-health.test.mjs \
            test/unit/panel-upgrade-script.test.mjs \
            test/unit/fleet-services.test.mjs \
            test/unit/billing-aggregation.test.mjs \
            test/unit/usage-logs-repo.test.mjs \
            test/unit/panel-billing-lookup.test.mjs \
            test/unit/openai-auth-state.test.mjs \
            test/unit/openai-api-credits.test.mjs \
            test/unit/openai-api-manager.test.mjs \
            test/unit/slot-browser-repo.test.mjs \
            test/unit/slot-browser-manager.test.mjs \
            test/unit/browser-stream.test.mjs \
            test/unit/codex-browser-login.test.mjs \
            test/unit/slot-cleanup.test.mjs \
            test/unit/openai-platform-adapter.test.mjs \
            test/unit/platform-browser.test.mjs \
            test/unit/panel-openai-api.test.mjs \
            test/unit/api-account-routing.test.mjs \
            test/unit/api-scheduler.test.mjs \
            test/unit/api-endpoints.test.mjs \
            test/unit/key-scope.test.mjs \
            test/unit/api-backend.test.mjs \
            test/unit/openai-subscription.test.mjs \
            test/unit/openai-quota.test.mjs \
            test/unit/codex-usage.test.mjs \
            test/unit/codex-credits.test.mjs \
            test/unit/codex-slot-pool.test.mjs \
            test/unit/codex-slot.test.mjs \
            test/unit/codex-quota-stale.test.mjs \
            test/unit/usage-probe-monitor.test.mjs \
            test/unit/panel-subscription.test.mjs \
            test/unit/jev-account-scope.test.mjs \
            test/unit/codex-slot-reload.test.mjs \
            test/unit/handle-codex.test.mjs \
            test/unit/handle-codex-search.test.mjs \
            test/unit/handle-codex-images.test.mjs \
            test/unit/vm-package.test.mjs; do
            node --test "$file"
          done
      - name: synthetic billing benchmark
        shell: bash
        run: |
          docker run --rm --network none --cpus 3 --memory 4g --memory-swap 4g \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            node:22-bookworm node scripts/benchmark-billing-aggregation.mjs | tee billing-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: billing-benchmark
          path: billing-benchmark.json
          retention-days: 7
      - name: web regressions and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/config/repo.test.ts src/features/settings/about-pane.test.ts
          pnpm exec vitest run src/lib/vm-status.test.ts -t 'GPT plan label follows OpenAI plan_type'
          pnpm exec vitest run src/features/vm/usage-windows.test.tsx src/features/vm/vm-rack-model.test.ts
          pnpm exec vitest run src/features/keys/key-payload.test.ts src/features/vm/openai-api-state.test.ts src/lib/decimal-display.test.ts src/features/keys/key-account-choices.test.ts src/features/vm/openai-api-credit-details.test.tsx src/features/vm/browser-frames.test.ts src/features/vm/codex-credential-panel.test.tsx
          pnpm build

  browser-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build control plane and smoke the pinned fingerprint browser
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/htexplicit/vm2api:validation-${{ github.event.pull_request.head.sha || github.sha }}
          provenance: false
          cache-from: type=gha,scope=vm2api-amd64
          cache-to: type=gha,scope=vm2api-amd64,mode=max
