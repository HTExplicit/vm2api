# Focused offline checks for amd64 fork releases.
name: ci

on:
  push:
    branches: [maint]
  pull_request:
    branches: [maint]
  workflow_dispatch:
    inputs:
      performance:
        description: 'Run offline admission A/B and billing isolation benchmarks'
        type: boolean
        default: false
      performance_base:
        description: 'Baseline commit for the same-host admission comparison'
        type: string
        default: '84c7e1bcb0e4a5e60d2677da1540118c6fa0d5d6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: redact/go.sum
      - run: npm ci
      - name: installer and upgrade shell syntax
        run: |
          bash -n deploy/install.sh
          sh -n scripts/panel-upgrade.sh
      - name: installer shared finalization
        working-directory: test/deploy
        run: python3 -m unittest test_install_schedule.ScheduleTests.test_upgrade_runs_shared_fleet_once_and_honors_no_sync test_install_schedule.ScheduleTests.test_crag_update_uses_existing_host_or_container_without_compose_restart test_install_schedule.ScheduleTests.test_crag_update_rejects_no_start_before_any_mutation
      - name: redaction helper unit checks
        working-directory: redact
        run: go test ./...
      - name: egress timeout and DNS regressions
        working-directory: worker
        run: go test -race ./internal/egress ./internal/proxy
      - name: focused backend regressions
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for file in \
            test/unit/forced-tool-choice.test.mjs \
            test/unit/sonnet-55-policy.test.mjs \
            test/unit/between-tools.test.mjs \
            test/unit/between-tools-ingress.test.mjs \
            test/unit/between-tools-outbound.test.mjs \
            test/unit/claude-code-betas.test.mjs \
            test/unit/auto-mode-reminder.test.mjs \
            test/unit/auto-mode-api.test.mjs \
            test/unit/claude-auth-login.test.mjs \
            test/unit/oauth-auth-url.test.mjs \
            test/unit/oauth-credentials.test.mjs \
            test/unit/slot-oauth.test.mjs \
            test/unit/session-oauth-seam.test.mjs \
            test/unit/slot-shell-rc.test.mjs \
            test/unit/crs-persona.test.mjs \
            test/unit/anthropic-policy.test.mjs \
            test/unit/cache-ttl.test.mjs \
