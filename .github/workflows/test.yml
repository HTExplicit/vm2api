          pnpm exec vitest run src/features/vm/openai-platform-browser-dialog.test.tsx
          pnpm exec vitest run src/features/vm/codex-browser-finish.test.ts src/features/vm/codex-credential-browser-completion.test.tsx
          pnpm exec vitest run src/features/vm/claude-credential-panel.test.tsx
          pnpm exec vitest run src/features/openai-apikey src/features/logs/account-api-logs.test.tsx src/components/layout/data/sidebar-data.test.ts
          pnpm exec vitest run src/features/logs/log-display.test.ts src/features/logs/export-query.test.ts src/features/logs/model-display.test.tsx
          pnpm exec vitest run src/features/anthropic/endpoint-save.test.ts
