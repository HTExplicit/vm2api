          pnpm exec vitest run src/features/vm/engine-editor.test.tsx src/lib/slash-line.test.ts src/features/vm/engine-contract.test.ts src/features/vm/persona-contract.test.ts src/lib/wrap-health.test.ts src/features/system/compat-patch.test.ts
          pnpm exec vitest run src/config/nav.test.ts src/features/auth/route-guard.test.ts src/features/users/user-concurrency.test.ts src/features/vm/vm-perms.test.ts
          pnpm exec vitest run src/lib/session-cache.test.ts src/lib/api.test.ts src/features/vm/use-vm-test-chat.test.tsx
          pnpm exec vitest run src/features/risk/jev-usage.test.tsx
          pnpm exec vitest run src/features/cluster/model.test.ts src/features/cluster/connection-rows.test.ts
          pnpm build
