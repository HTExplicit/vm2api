            test/unit/remote-memory-raise-bridge.test.mjs \
            test/unit/routing-runtime-load.test.mjs \
            test/unit/schedule-state.test.mjs \
            test/unit/scoped-intercept-session.test.mjs \
            test/unit/slot-claude.test.mjs \
            test/unit/kernel-install-sandbox.test.mjs \
            test/unit/kernel-install-writer-locks.test.mjs \
            test/unit/panel-kernels.test.mjs \
            test/unit/slot-degraded-recovery.test.mjs \
            test/unit/slot-migration.test.mjs \
            test/unit/wrap-cli-runtime.test.mjs \
            test/unit/slot-engine.test.mjs \
            test/unit/key-self.test.mjs \
            test/unit/panel-acl.test.mjs \
            test/unit/panel-users.test.mjs \
            test/unit/statistics-repo.test.mjs \
            test/unit/official-cache-breakpoints.test.mjs \
            test/unit/redaction-policy.test.mjs \
            test/unit/redaction-runtime.test.mjs \
            test/unit/vm-package.test.mjs; do
            node --test "$file" || failed=$((failed + 1))
          done
          test "$failed" -eq 0
      - name: Model defaults fill missing output budgets
        run: node --test --test-name-pattern='^officialMessagesBody keeps a caller max_tokens and fills a missing one from the model$' test/unit/crs-clean.test.mjs
      - name: Inline tool beta reaches the final CLI hop
        run: node --test --test-name-pattern='^cli-hop appends inline-tools when a message carries a tool_definition$' test/unit/go-worker-client.test.mjs
      - name: Persisted kernel restart pending
        run: node --test --test-name-pattern='^unchanged wrap payload reconciles persisted restart pending \((check|success|failure|throw|stopped)\)$' test/unit/panel-wrap-sync.test.mjs
      - name: Oversized protocol body stops before scheduling
        run: node --test --test-name-pattern='^oversized protocol body returns 413 before scheduling$' test/unit/respond-sse.test.mjs
      - name: Personal API keys stay within authenticated owners
        run: node --test --test-name-pattern='^real admin and user sessions cannot list or operate each other personal keys$' test/e2e/api-keys.e2e.test.mjs
      - name: Configured API endpoints support both protocols
        run: node --test --test-name-pattern='^generated API key lists configured models and calls both protocols through API endpoints$' test/e2e/api-channel.e2e.test.mjs
      - name: Managed keys read their own quota and usage
        run: node --test --test-name-pattern='^managed keys read their own quota and usage; expired keys still can, disabled cannot$' test/e2e/key-self.e2e.test.mjs
      - name: OAuth exchange uses the VM egress
        run: node --test --test-name-pattern='^OAuth exchange reuses VM egress without a host-side proxy hop$' test/e2e/panel-api.e2e.test.mjs
      - name: synthetic billing benchmark
        shell: bash
        run: |
          docker run --rm --network none --cpus 3 --memory 4g --memory-swap 4g \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            node:22-bookworm node scripts/benchmark-billing-aggregation.mjs | tee billing-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: billing-benchmark
          path: billing-benchmark.json
          retention-days: 7
      - name: web regressions and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/features/pelican/pelican.test.ts src/features/pelican/preview-fit.test.ts
