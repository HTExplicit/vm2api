        run: node scripts/smoke-platform-retry-ui.mjs
      - name: Account API key management UI
        run: node scripts/smoke-openai-apikey-ui.mjs
      - name: Browser close retry UI
        run: node scripts/smoke-browser-close-ui.mjs
      - name: Import browser login flow
        run: node scripts/smoke-import-browser-flow.mjs
      - name: Browser address navigation
        run: node scripts/smoke-browser-navigation.mjs

  performance:
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PERFORMANCE_BASE: ${{ inputs.performance_base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: prepare exact baseline source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PERFORMANCE_BASE" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$PERFORMANCE_BASE^{commit}"
          mkdir .performance-base
          git archive "$PERFORMANCE_BASE" src package.json | tar -x -C .performance-base
          mkdir -p "$RUNNER_TEMP/performance-results"
      - name: run both checkouts on the same isolated Linux host
        shell: bash
        run: |
          docker run --rm --network none --cpus 3 --memory 4g --memory-swap 4g \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/performance-results:/results" -w /work \
            node:22-bookworm node scripts/compare-performance.mjs \
            --baseline-root /work/.performance-base --output-dir /results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-comparison
          path: ${{ runner.temp }}/performance-results
          retention-days: 30

  browser-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build control plane and smoke the pinned fingerprint browser
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/htexplicit/vm2api:validation-${{ github.event.pull_request.head.sha || github.sha }}
          provenance: false
          cache-from: type=gha,scope=vm2api-amd64
          cache-to: type=gha,scope=vm2api-amd64,mode=max
      - name: Manual Claude OAuth helper against offline TLS and SOCKS fixtures
        run: |
          docker run --rm --network none --entrypoint sh \
            --mount "type=bind,src=$GITHUB_WORKSPACE/test,dst=/opt/vm2api/test,readonly" \
            ghcr.io/htexplicit/vm2api:validation-${{ github.event.pull_request.head.sha || github.sha }} \
            -c 'set -eu; command -v openssl; ln -s /opt/vm2api/image-bin/kin-oauth-auth /opt/vm2api/bin/kin-oauth-auth; node --test test/unit/oauth-binary.test.mjs'
