# Fork releases stay draft until the amd64 image is publicly readable.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: 'Existing draft release tag to recover; empty uses the normal release flow'
        required: false
        type: string
      recovery_digest:
        description: 'Digest of the successful validation image for that tag commit'
        required: false
        type: string
      recovery_run_id:
        description: 'Successful CI run containing the matching browser-image build'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-amd64:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: verify release tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v${version}"
      - name: create draft before building the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          HTExplicit/vm2api 维护版。本次变更与升级说明见下方对应版本的 CHANGELOG.md。

          本轮仅支持 linux/amd64。22 个载荷附件均从同一最终控制面镜像提取：21 个按 deploy/payload.json 核验官方 086 不可变发行 payload-2026.11.13-crag-2.8.17 的固定载荷及 CRAG v2.8.17 签名归档，kin-egress 由本 fork 源码构建；另附 build-provenance.json，共 23 个附件。CRAG 归档与出厂散件核对签名及字节一致；kin-redact 由源码构建并随镜像交付。HTTP CONNECT 已支持槽位出口，现有代理绑定保持。CRAG 原生交接依据实际运行内核能力协商，发布配套包不会启用 CRAG 或切换内核。
          控制面镜像：`ghcr.io/htexplicit/vm2api:TAG` 和 `ghcr.io/htexplicit/vm2api:TAG-amd64`。

          变更与升级说明：[CHANGELOG.md](https://github.com/HTExplicit/vm2api/blob/TAG/CHANGELOG.md)。许可证与上游归属保留。
          NOTES
          sed -i "s/TAG/${GITHUB_REF_NAME}/g" release-notes.md
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo 'Release is already public; refusing to replace published assets.' >&2
              exit 1
            }
            gh release edit "$GITHUB_REF_NAME" --title "vm2api ${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "vm2api ${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi

  image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: linux-amd64
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image reference
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: build and push amd64 control plane
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-amd64
          cache-from: type=gha,scope=vm2api-amd64
          cache-to: type=gha,scope=vm2api-amd64,mode=max
      - name: install release verification dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: extract and verify all 23 draft assets from that image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: node scripts/release-assets.mjs --image "$RELEASE_IMAGE" --tag "$GITHUB_REF_NAME"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image-amd64
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_DIGEST: ${{ needs.image-amd64.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: verify image is anonymously readable
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          anonymous_config=$(mktemp -d)
          if ! DOCKER_CONFIG="$anonymous_config" docker manifest inspect "${image}@${RELEASE_DIGEST}" >/dev/null; then
            echo '::error::GHCR is not anonymously readable. Release remains draft and latest has not moved. Set the package visibility to Public, verify an anonymous docker pull, then rerun only the failed publish job.'
            exit 1
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish latest image and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --prefer-index=false \
            --tag "${image}:latest" "${image}@${RELEASE_DIGEST}"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # Recover an existing draft from an exact, successful CI build when upstream
  # asset downloads fail. Refill only the draft from that exact image; source
  # tags and upstream pins stay unchanged.
  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RECOVERY_TAG: ${{ inputs.recovery_tag }}
      RECOVERY_DIGEST: ${{ inputs.recovery_digest }}
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
    steps:
      - name: validate recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RECOVERY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recovery_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - name: verify tag, successful CI, and validation image
        shell: bash
        run: |
          set -euo pipefail
          test "$RECOVERY_TAG" = "v$(tr -d '[:space:]' < VERSION)"
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID" > "$RUNNER_TEMP/recovery-run.json"
          jq -e --arg sha "$sha" '.conclusion == "success" and .head_sha == $sha' "$RUNNER_TEMP/recovery-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/jobs" > "$RUNNER_TEMP/recovery-jobs.json"
          jq -e '.jobs | any(.name == "browser-image" and .conclusion == "success")' "$RUNNER_TEMP/recovery-jobs.json" >/dev/null
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          test "$(docker buildx imagetools inspect "$image:validation-$sha" --format '{{.Manifest.Digest}}')" = "$RECOVERY_DIGEST"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: install release verification dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: refill and verify the draft from the exact validation image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          node scripts/release-assets.mjs --image "$image@$RECOVERY_DIGEST" --tag "$RECOVERY_TAG"
      - name: promote exact digest and verify anonymous access
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --prefer-index=false \
            --tag "$image:$RECOVERY_TAG" --tag "$image:$RECOVERY_TAG-amd64" "$image@$RECOVERY_DIGEST"
          anonymous_config=$(mktemp -d)
          for tag in "$RECOVERY_TAG" "$RECOVERY_TAG-amd64"; do
            test "$(DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')" = "$RECOVERY_DIGEST"
          done
      - name: publish verified latest image and release
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image@$RECOVERY_DIGEST"
          gh release edit "$RECOVERY_TAG" --draft=false --latest
